# ==============================================================================
# TMECHANICS
# ==============================================================================
TCLIENTS_ADD = INSERT INTO TClients (id, nif, name, surname, email, phone, city, street, version, createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = DELETE FROM TMechanics WHERE id = ?
TMECHANICS_UPDATE = UPDATE TMechanics SET name = ?, surname = ?, nif = ?, version = version + 1, updatedAt = ? WHERE id = ?
TMECHANICS_FINDBYID = SELECT * FROM TMechanics WHERE id = ?
TMECHANICS_FINDBYNIF = SELECT * FROM TMechanics WHERE nif = ?
TMECHANICS_FINDALL = SELECT * FROM TMechanics

# ==============================================================================
# TWORKORDERS
# ==============================================================================
TWORKORDERS_ADD = INSERT INTO TWorkOrders (id, total_amount, date, description, state, invoice_id, mechanic_id, vehicle_id, version, createdAt, updatedAt, entityState, usedForVoucher) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, FALSE)
TWORKORDERS_REMOVE = DELETE FROM TWorkOrders WHERE id = ?
TWORKORDERS_UPDATE = UPDATE TWorkOrders SET description = ?, total_amount = ?, state = ?, invoice_id = ?, mechanic_id = ?, vehicle_id = ?, version = version + 1, updatedAt = ? WHERE id = ?
TWORKORDERS_FINDBYID = SELECT * FROM TWorkOrders WHERE id = ?
TWORKORDERS_FINDALL = SELECT * FROM TWorkOrders
TWORKORDERS_FIND_NOT_INVOICED = SELECT w.* FROM TWorkOrders w WHERE w.state = 'FINISHED' AND w.invoice_id IS NULL AND w.vehicle_id IN (SELECT v.id FROM TVehicles v WHERE v.client_id IN (SELECT c.id FROM TClients c WHERE c.nif = ?))
TWORKORDERS_FIND_NOT_INVOICED_BY_CLIENT_NIF = SELECT w.* FROM TWorkOrders w INNER JOIN TVehicles v ON w.vehicle_id = v.id INNER JOIN TClients c ON v.client_id = c.id WHERE c.nif = ? AND w.state = 'FINISHED'
TWORKORDERS_FIND_BY_CLIENT_ID = SELECT w.* FROM TWorkOrders w INNER JOIN TVehicles v ON w.vehicle_id = v.id WHERE v.client_id = ?
TWORKORDERS_FIND_BY_INVOICE_ID = SELECT * FROM TWorkOrders WHERE invoice_id = ?

