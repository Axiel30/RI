# TINVOICES
TINVOICES_SELECT_LAST_NUMBER = SELECT MAX(number) FROM TInvoices
TINVOICES_INSERT = INSERT INTO TInvoices (id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TINVOICES_FINDBYID = select id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState from TInvoices where id = ?
TINVOICES_FINDBYNUMBER = select id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState from TInvoices where number = ?
TINVOICES_UPDATE = update TInvoices set total = ?, vatrate = ?, vatamount = ?, subtotal = ?, date = ?, state = ?, version = version + 1, updatedAt = ? where id = ?

# TMECHANICS
TMECHANICS_ADD = insert into TMechanics(id, nif, name, surname, version, createdAt, updatedAt, entityState) values (?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = delete from TMechanics where id = ?
TMECHANICS_FINDBYNIF = select id, nif, name, surname, version, createdAt, updatedAt, entityState from TMechanics where nif = ?
TMECHANICS_FINDALL = select id, nif, name, surname, version, createdAt, updatedAt, entityState from TMechanics
TMECHANICS_UPDATE = update TMechanics set nif = ?, name = ?, surname = ?, version = version+1, updatedat = ? where id = ?
TMECHANICS_FINDBYID = select id, nif, name, surname, version, createdAt, updatedAt, entityState from TMechanics where id = ?

# TWORKORDERS
TWORKORDERS_FIND_NOT_INVOICED = select a.id, a.description, a.date, a.state, a.total_amount, a.vehicle_id, a.mechanic_id, a.invoice_id, a.version, a.createdAt, a.updatedAt, a.entityState from TWorkOrders as a, TVehicles as v, TClients as c where a.vehicle_id = v.id and v.client_id = c.id and a.state like 'APPROVED' and c.nif like ?
TWORKORDERS_FINDBYID = select id, total_amount, date, description, state, invoice_id, mechanic_id, vehicle_id, version, createdAt, updatedAt, entityState from TWorkOrders where id = ?
TWORKORDERS_FINDALL = select id, total_amount, date, description, state, invoice_id, mechanic_id, vehicle_id, version, createdAt, updatedAt, entityState from TWorkOrders
TWORKORDERS_ADD = insert into TWorkOrders(id, total_amount, date, description, state, invoice_id, mechanic_id, vehicle_id, version, createdAt, updatedAt, entityState) values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TWORKORDERS_UPDATE = update TWorkOrders set description = ?, total_amount = ?, state = ?, invoice_id = ?, mechanic_id = ?, vehicle_id = ?, updatedAt = ?, version = version + 1 where id = ?
TWORKORDERS_REMOVE = delete from TWorkOrders where id = ?