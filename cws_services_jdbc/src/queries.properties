TINVOICES_ADD = INSERT INTO TInvoices (id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState, usedForVoucher) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, FALSE)
TINVOICES_INSERT = INSERT INTO TInvoices (id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState, usedForVoucher) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, FALSE)
TINVOICES_FINDBYID = SELECT * FROM TInvoices WHERE id = ?
TINVOICES_FINDBYNUMBER = SELECT * FROM TInvoices WHERE number = ?
TINVOICES_FINDALL = SELECT * FROM TInvoices
TINVOICES_UPDATE = UPDATE TInvoices SET number = ?, date = ?, vatrate = ?, vatamount = ?, subtotal = ?, total = ?, state = ?, version = version + 1, updatedAt = ? WHERE id = ?

