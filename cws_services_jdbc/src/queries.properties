TRECOMMENDATIONS_FINDNOTUSEDBYSPONSORID = SELECT id, recommender_id, recommended_id, usedForVoucher, version, createdAt, updatedAt, entityState FROM TRecommendations WHERE recommender_id = ? AND usedForVoucher = FALSE
TRECOMMENDATIONS_MARKASUSED = UPDATE TRecommendations SET usedForVoucher = TRUE, version = version + 1, updatedAt = ? WHERE id = ?

# ==============================================================================
# TPAYMENTMEANS, TVOUCHERS, TCREDITCARDS, TCASHES, TCHARGES
# ==============================================================================
TCHARGES_FINDBYPAYMENTMEANID = SELECT c.id, c.createdAt, c.entityState, c.updatedAt, c.version, c.charge, c.invoice_id, c.paymentmean_id FROM TCharges c WHERE c.paymentmean_id = ?

TPAYMENTMEANS_INSERT = INSERT INTO TPaymentMeans (id, dtype, accumulated, client_id, version, createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
TPAYMENTMEANS_DELETE = DELETE FROM TPaymentMeans WHERE id = ?
TPAYMENTMEANS_FINDBYID = SELECT id, dtype, accumulated, client_id, version, createdAt, updatedAt, entityState FROM TPaymentMeans WHERE id = ?
TPAYMENTMEANS_FINDBYCLIENTID = SELECT id, dtype, accumulated, client_id, version, createdAt, updatedAt, entityState FROM TPaymentMeans WHERE client_id = ?

TCASHES_FINDBYID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState FROM TCashes c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE p.id = ?
TCASHES_FINDBYCLIENTID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState FROM TCashes c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE p.client_id = ?

TCREDITCARDS_FINDBYNUMBER = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, c.type, c.validthru, c.number FROM TCreditCards c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE c.number = ?
TCREDITCARDS_INSERT = INSERT INTO TCreditCards (id, type, validthru, number) VALUES (?, ?, ?, ?)
TCREDITCARDS_FINDBYID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, c.type, c.validthru, c.number FROM TCreditCards c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE p.id = ?
TCREDITCARDS_FINDBYCLIENTID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, c.type, c.validthru, c.number FROM TCreditCards c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE p.client_id = ?
TCREDITCARDS_DELETE = DELETE FROM TCreditCards WHERE id = ?

TVOUCHERS_FINDBYCODE = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description FROM TVouchers v INNER JOIN TPaymentMeans p ON v.id = p.id WHERE v.code = ?
TVOUCHERS_INSERT = INSERT INTO TVouchers (id, available, code, description) VALUES (?, ?, ?, ?)
TVOUCHERS_DELETE = DELETE FROM TVouchers WHERE id = ?
TVOUCHERS_FINDBYID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description FROM TVouchers v INNER JOIN TPaymentMeans p ON v.id = p.id WHERE p.id = ?
TVOUCHERS_FINDBYCLIENTID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description FROM TVouchers v INNER JOIN TPaymentMeans p ON v.id = p.id WHERE p.id = ?
TVOUCHERS_FINDBYCLIENTNIF = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description  FROM TVouchers v  INNER JOIN TPaymentMeans p ON v.id = p.id INNER JOIN TClients c ON p.client_id = c.id WHERE c.nif = ?