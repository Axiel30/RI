# ---------------------------------------------------------------- Mechanics
TMECHANICS_ADD = INSERT INTO TMechanics \
	(id, nif, name, surname, version, createdAt, updatedAt, entityState) \
	VALUES (?, ?, ?, ?, ?, ?, ?, ?)

TMECHANICS_REMOVE = DELETE FROM TMechanics WHERE id = ?

TMECHANICS_UPDATE = UPDATE TMechanics \
	SET name = ?, surname = ?, nif = ?, version = version + 1, updatedAt = ? \
	WHERE id = ?

TMECHANICS_FINDBYID = SELECT * FROM TMechanics WHERE id = ?

TMECHANICS_FINDBYNIF = SELECT * FROM TMechanics WHERE nif = ?

TMECHANICS_FINDALL = SELECT * FROM TMechanics

# -------------------------------------------------------------- Work orders
TWORKORDERS_ADD = INSERT INTO TWorkOrders \
	(id, date, description, total_amount, state, version, createdAt, updatedAt, \
		entityState, invoice_id, mechanic_id, vehicle_id, usedForVoucher) \
	VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

TWORKORDERS_REMOVE = DELETE FROM TWorkOrders WHERE id = ?

TWORKORDERS_UPDATE = UPDATE TWorkOrders \
	SET description = ?, total_amount = ?, state = ?, invoice_id = ?, \
		mechanic_id = ?, vehicle_id = ?, usedForVoucher = ?, version = version + 1, updatedAt = ? \
	WHERE id = ?

TWORKORDERS_FINDBYID = SELECT * FROM TWorkOrders WHERE id = ?

TWORKORDERS_FINDALL = SELECT * FROM TWorkOrders

TWORKORDERS_FINDBYCLIENTNIFANDSTATE = SELECT w.* FROM TWorkOrders w \
	INNER JOIN TVehicles v ON w.vehicle_id = v.id \
	INNER JOIN TClients c ON v.client_id = c.id \
	WHERE c.nif = ? AND w.state = ?

TWORKORDERS_EXISTSBYMECHANICID = SELECT id FROM TWorkOrders WHERE mechanic_id = ?

