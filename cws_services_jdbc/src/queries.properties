# ----------------------------------------------------------------- Vouchers
TVOUCHERS_ADD = INSERT INTO TVouchers (id, code, description, available) \
	VALUES (?, ?, ?, ?)

TVOUCHERS_UPDATE = UPDATE TVouchers SET description = ?, available = ? WHERE id = ?

TVOUCHERS_REMOVE = DELETE FROM TVouchers WHERE id = ?

TVOUCHERS_FINDBYCODE = SELECT p.id, p.dtype, p.version, p.entityState, p.createdAt, \
		p.updatedAt, p.accumulated, p.client_id, \
		v.code, v.description, v.available, c.number, c.type, c.validThru \
	FROM TPaymentMeans p \
	INNER JOIN TVouchers v ON v.id = p.id \
	LEFT JOIN TCreditCards c ON c.id = p.id \
	WHERE v.code = ?

TVOUCHERS_FINDBYCLIENTNIF = SELECT p.id, p.dtype, p.version, p.entityState, p.createdAt, \
		p.updatedAt, p.accumulated, p.client_id, \
		v.code, v.description, v.available, c.number, c.type, c.validThru \
	FROM TPaymentMeans p \
	INNER JOIN TVouchers v ON v.id = p.id \
	LEFT JOIN TCreditCards c ON c.id = p.id \
	INNER JOIN TClients cl ON cl.id = p.client_id \
	WHERE cl.nif = ?

TVOUCHERS_FINDALL = SELECT p.id, p.dtype, p.version, p.entityState, p.createdAt, \
		p.updatedAt, p.accumulated, p.client_id, \
		v.code, v.description, v.available, c.number, c.type, c.validThru \
	FROM TPaymentMeans p \
	INNER JOIN TVouchers v ON v.id = p.id \
	LEFT JOIN TCreditCards c ON c.id = p.id

