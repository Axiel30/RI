# TWORKORDERS
TWORKORDERS_FIND_NOT_INVOICED = select a.id, a.description, a.date, a.state, a.total_amount, a.vehicle_id, a.mechanic_id, a.invoice_id, a.version, a.createdAt, a.updatedAt, a.entityState from TWorkOrders as a, TVehicles as v, TClients as c where a.vehicle_id = v.id and v.client_id = c.id and a.state like 'APPROVED' and c.nif like ?
TWORKORDERS_FINDBYID = select id, total_amount, date, description, state, invoice_id, mechanic_id, vehicle_id, version, createdAt, updatedAt, entityState from TWorkOrders where id = ?
TWORKORDERS_FINDALL = select id, total_amount, date, description, state, invoice_id, mechanic_id, vehicle_id, version, createdAt, updatedAt, entityState from TWorkOrders
TWORKORDERS_ADD = insert into TWorkOrders(id, total_amount, date, description, state, invoice_id, mechanic_id, vehicle_id, version, createdAt, updatedAt, entityState) values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TWORKORDERS_UPDATE = update TWorkOrders set description = ?, total_amount = ?, state = ?, invoice_id = ?, mechanic_id = ?, vehicle_id = ?, updatedAt = ?, version = version + 1 where id = ?
TWORKORDERS_REMOVE = delete from TWorkOrders where id = ?

# TINVOICES
TINVOICES_SELECT_LAST_NUMBER = SELECT MAX(number) FROM TInvoices
TINVOICES_INSERT = INSERT INTO TInvoices (id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TINVOICES_FINDBYID = select id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState from TInvoices where id = ?
TINVOICES_FINDBYNUMBER = select id, number, date, vatrate, vatamount, subtotal, total, state, version, createdAt, updatedAt, entityState from TInvoices where number = ?
TINVOICES_UPDATE = update TInvoices set total = ?, vatrate = ?, vatamount = ?, subtotal = ?, date = ?, state = ?, version = version + 1, updatedAt = ? where id = ?

# TMECHANICS
TMECHANICS_ADD = insert into TMechanics(id, nif, name, surname, version, createdAt, updatedAt, entityState) values (?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = delete from TMechanics where id = ?
TMECHANICS_FINDBYNIF = select id, nif, name, surname, version, createdAt, updatedAt, entityState from TMechanics where nif = ?
TMECHANICS_FINDALL = select id, nif, name, surname, version, createdAt, updatedAt, entityState from TMechanics
TMECHANICS_UPDATE = update TMechanics set nif = ?, name = ?, surname = ?, version = version+1, updatedat = ? where id = ?
TMECHANICS_FINDBYID = select id, nif, name, surname, version, createdAt, updatedAt, entityState from TMechanics where id = ?

# TCLIENTS
TCLIENTS_FINDBYID = SELECT id, nif, name, surname, email, phone, city, street, zipcode, version, createdAt, updatedAt, entityState FROM TClients WHERE id = ?
TCLIENTS_FINDBYNIF = SELECT id, nif, name, surname, email, phone, city, street, zipcode, version, createdAt, updatedAt, entityState FROM TClients WHERE nif = ?
TCLIENTS_FINDALL = SELECT id, nif, name, surname, email, phone, city, street, zipcode, version, createdAt, updatedAt, entityState FROM TClients

# TRECOMMENDATIONS
TRECOMMENDATIONS_FINDBYSPONSORID = SELECT id, sponsor_id, recommended_id, usedForVoucher, version, createdAt, updatedAt, entityState FROM TRecommendations WHERE sponsor_id = ?
TRECOMMENDATIONS_FINDNOTUSEDBYSPONSORID = SELECT id, sponsor_id, recommended_id, usedForVoucher, version, createdAt, updatedAt, entityState FROM TRecommendations WHERE sponsor_id = ? AND usedForVoucher = FALSE
TRECOMMENDATIONS_MARKASUSED = UPDATE TRecommendations SET usedForVoucher = TRUE, version = version + 1, updatedAt = ? WHERE id = ?

# TPAYMENTMEANS, TVOUCHERS, TCREDITCARDS, TCASHES, TCHARGES
TPAYMENTMEANS_INSERT = INSERT INTO TPaymentMeans (id, dtype, accumulated, client_id, version, createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
TPAYMENTMEANS_DELETE = DELETE FROM TPaymentMeans WHERE id = ?
TPAYMENTMEANS_FINDBYID = SELECT id, dtype, accumulated, client_id, version, createdAt, updatedAt, entityState FROM TPaymentMeans WHERE id = ?
TPAYMENTMEANS_FINDBYCLIENTID = SELECT id, dtype, accumulated, client_id, version, createdAt, updatedAt, entityState FROM TPaymentMeans WHERE client_id = ?

TVOUCHERS_INSERT = INSERT INTO TVouchers (id, available, code, description) VALUES (?, ?, ?, ?)
TVOUCHERS_DELETE = DELETE FROM TVouchers WHERE id = ?
TVOUCHERS_FINDBYID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description FROM TVouchers v INNER JOIN TPaymentMeans p ON v.id = p.id WHERE p.id = ?
TVOUCHERS_FINDBYCODE = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description FROM TVouchers v INNER JOIN TPaymentMeans p ON v.id = p.id WHERE v.code = ?
TVOUCHERS_FINDBYCLIENTID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description FROM TVouchers v INNER JOIN TPaymentMeans p ON v.id = p.id WHERE p.client_id = ?
TVOUCHERS_FINDBYCLIENTNIF = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, v.available, v.code, v.description FROM TVouchers v INNER JOIN TPaymentMeans p ON v.id = p.id INNER JOIN TClients c ON p.client_id = c.id WHERE c.nif = ?

TCREDITCARDS_INSERT = INSERT INTO TCreditCards (id, number, type, validThru) VALUES (?, ?, ?, ?)
TCREDITCARDS_DELETE = DELETE FROM TCreditCards WHERE id = ?
TCREDITCARDS_FINDBYID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, c.number, c.type, c.validThru FROM TCreditCards c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE p.id = ?
TCREDITCARDS_FINDBYNUMBER = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, c.number, c.type, c.validThru FROM TCreditCards c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE c.number = ?
TCREDITCARDS_FINDBYCLIENTID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState, c.number, c.type, c.validThru FROM TCreditCards c INNER JOIN TPaymentMeans p ON c.id = p.id WHERE p.client_id = ?

TCASHES_FINDBYID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState FROM TCashes ca INNER JOIN TPaymentMeans p ON ca.id = p.id WHERE p.id = ?
TCASHES_FINDBYCLIENTID = SELECT p.id, p.dtype, p.accumulated, p.client_id, p.version, p.createdAt, p.updatedAt, p.entityState FROM TCashes ca INNER JOIN TPaymentMeans p ON ca.id = p.id WHERE p.client_id = ?

TCHARGES_FINDBYPAYMENTMEANID = SELECT id, amount, invoice_id, paymentMean_id, version, createdAt, updatedAt, entityState FROM TCharges WHERE paymentMean_id = ?