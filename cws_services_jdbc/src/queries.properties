# ------------------------------------------------------------------ Clients
TCLIENTS_ADD = INSERT INTO TClients \
	(id, nif, name, surname, email, phone, street, city, postalCode, country, \
		version, createdAt, updatedAt, entityState) \
	VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

TCLIENTS_REMOVE = DELETE FROM TClients WHERE id = ?

TCLIENTS_UPDATE = UPDATE TClients \
	SET nif = ?, name = ?, surname = ?, email = ?, phone = ?, street = ?, city = ?, \
		postalCode = ?, country = ?, version = version + 1, updatedAt = ? \
	WHERE id = ?

TCLIENTS_FINDBYID = SELECT * FROM TClients WHERE id = ?

TCLIENTS_FINDBYNIF = SELECT * FROM TClients WHERE nif = ?

TCLIENTS_FINDALL = SELECT * FROM TClients

TCLIENTS_FINDRECOMMENDEDBYNIF = SELECT c.* FROM TClients c \
	INNER JOIN TRecommendations r ON r.recommended_id = c.id \
	INNER JOIN TClients s ON r.recommender_id = s.id \
	WHERE s.nif = ?

TCLIENTS_FINDWITHINVOICESTATE = SELECT DISTINCT c.* FROM TClients c \
	INNER JOIN TVehicles v ON v.client_id = c.id \
	INNER JOIN TWorkOrders w ON w.vehicle_id = v.id \
	INNER JOIN TInvoices i ON w.invoice_id = i.id \
	WHERE i.state = ?

# --------------------------------------------------------- Recommendations
TRECOMMENDATIONS_FINDNOTUSEDBYSPONSORID = SELECT * FROM TRecommendations \
	WHERE recommender_id = ? AND COALESCE(usedForVoucher, FALSE) = FALSE

TRECOMMENDATIONS_ADD = INSERT INTO TRecommendations \
	(id, recommender_id, recommended_id, usedForVoucher, version, createdAt, updatedAt, entityState) \
	VALUES (?, ?, ?, ?, ?, ?, ?, ?)

TRECOMMENDATIONS_REMOVE = DELETE FROM TRecommendations WHERE id = ?

TRECOMMENDATIONS_UPDATE = UPDATE TRecommendations \
	SET usedForVoucher = ?, version = version + 1, updatedAt = ? \
	WHERE id = ?

TRECOMMENDATIONS_FINDBYID = SELECT * FROM TRecommendations WHERE id = ?

TRECOMMENDATIONS_FINDALL = SELECT * FROM TRecommendations

TRECOMMENDATIONS_FINDBYCLIENTID = SELECT * FROM TRecommendations \
	WHERE recommender_id = ? OR recommended_id = ?

# ------------------------------------------------------------ Payment means
# Every query reading payment means returns the same columns, so that a row
# can be converted to a cash, a voucher or a credit card (see its dtype)
TPAYMENTMEANS_ADD = INSERT INTO TPaymentMeans \
	(id, dtype, accumulated, client_id, version, createdAt, updatedAt, entityState) \
	VALUES (?, ?, ?, ?, ?, ?, ?, ?)

TPAYMENTMEANS_REMOVE = DELETE FROM TPaymentMeans WHERE id = ?

TPAYMENTMEANS_UPDATE = UPDATE TPaymentMeans \
	SET accumulated = ?, version = version + 1, updatedAt = ? \
	WHERE id = ?

TPAYMENTMEANS_FINDBYID = SELECT p.id, p.dtype, p.version, p.entityState, p.createdAt, \
		p.updatedAt, p.accumulated, p.client_id, \
		v.code, v.description, v.available, c.number, c.type, c.validThru \
	FROM TPaymentMeans p \
	LEFT JOIN TVouchers v ON v.id = p.id \
	LEFT JOIN TCreditCards c ON c.id = p.id \
	WHERE p.id = ?

TPAYMENTMEANS_FINDALL = SELECT p.id, p.dtype, p.version, p.entityState, p.createdAt, \
		p.updatedAt, p.accumulated, p.client_id, \
		v.code, v.description, v.available, c.number, c.type, c.validThru \
	FROM TPaymentMeans p \
	LEFT JOIN TVouchers v ON v.id = p.id \
	LEFT JOIN TCreditCards c ON c.id = p.id

TPAYMENTMEANS_FINDBYCLIENTID = SELECT p.id, p.dtype, p.version, p.entityState, p.createdAt, \
		p.updatedAt, p.accumulated, p.client_id, \
		v.code, v.description, v.available, c.number, c.type, c.validThru \
	FROM TPaymentMeans p \
	LEFT JOIN TVouchers v ON v.id = p.id \
	LEFT JOIN TCreditCards c ON c.id = p.id \
	WHERE p.client_id = ?

TCHARGES_EXISTSBYPAYMENTMEANID = SELECT id FROM TCharges WHERE paymentmean_id = ?

